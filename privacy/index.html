<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policies</title>
<meta name="description" content="Privacy policies for mobile apps published by Matchmania Studio.">
<style>
  :root { --bg:#fff; --fg:#1c1c1e; --muted:#5b5b60; --rule:#e2e2e6; --accent:#0b57d0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121214; --fg:#e8e8ea; --muted:#a1a1a8; --rule:#2c2c31; --accent:#8ab4f8; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 3rem 1.15rem;
    background: var(--bg); color: var(--fg);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 .6rem; }
  a { color: var(--accent); }
  ul { list-style: none; padding: 0; margin: 1.8rem 0; }
  li { border-top: 1px solid var(--rule); }
  li:last-child { border-bottom: 1px solid var(--rule); }
  li a { display: block; padding: 1rem .2rem; text-decoration: none; font-weight: 600; }
  li a:hover { text-decoration: underline; }
  li span { display: block; color: var(--muted); font-size: .93rem; font-weight: 400; margin-top: .15rem; }
  footer { color: var(--muted); font-size: .93rem; }
</style>
</head>
<body>
<main>
  <h1>Privacy Policies</h1>
  <p>Privacy policies for mobile apps published by Matchmania Studio.</p>
  <ul>
    <li><a href="matchmania/">Matchmania<span>Match-3 arcade game — Android, iOS</span></a></li>
  </ul>
  <footer>
    <p>Contact: <a href="mailto:matchmania.studio@gmail.com">matchmania.studio@gmail.com</a></p>
  </footer>
</main>
</body>
</html>
